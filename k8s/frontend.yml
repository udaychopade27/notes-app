apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: notes-app

spec:

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: uday27/notes-app-frontend:latest

          ports:
            - containerPort: 3000

          env:
            - name: REACT_APP_API_URL
              value: /api

---
apiVersion: v1
kind: Service

metadata:
  name: frontend-service
  namespace: notes-app
spec:
  type: NodePort

  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30000