server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    charset utf-8;

    client_max_body_size 100m;

    # ----------------------------------------
    # React SPA Routing
    # ----------------------------------------
    location / {

        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------
    # Static Assets Cache
    # ----------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {

        expires 7d;

        add_header Cache-Control "public, no-transform";
    }

    # ----------------------------------------
    # Gzip
    # ----------------------------------------
    gzip on;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
}