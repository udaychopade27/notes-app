
server {
    listen 80;
    charset utf-8;

    client_max_body_size 100m;
    root /usr/share/nginx/html;
    index index.html;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH)$ ){
        return 405;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }

    location / {
        gzip_static on;
        try_files $uri @index;
    }

    location @index {
        add_header Cache-Control no-cache;
        expires 0;
        try_files /index.html =404;
    }
}
