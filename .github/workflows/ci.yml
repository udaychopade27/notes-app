name: CI-DevSecOps

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.run_number }}

jobs:

  security-and-build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------
      # Secret Scan
      # -----------------------------------
      - name: Gitleaks Scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
            GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

      # -----------------------------------
      # Filesystem Scan
      # -----------------------------------
      - name: Trivy Filesystem Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM

      # -----------------------------------
      # Docker Login
      # -----------------------------------
      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------
      # Build Backend
      # -----------------------------------
      - name: Build Backend Image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/notes-app-backend:${{ env.IMAGE_TAG }} \
          ./backend

      # -----------------------------------
      # Build Frontend
      # -----------------------------------
      - name: Build Frontend Image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/notes-app-frontend:${{ env.IMAGE_TAG }} \
          ./frontend

      # -----------------------------------
      # Scan Backend Image
      # -----------------------------------
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/notes-app-backend:${{ env.IMAGE_TAG }}

      # -----------------------------------
      # Scan Frontend Image
      # -----------------------------------
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/notes-app-frontend:${{ env.IMAGE_TAG }}

      # -----------------------------------
      # Push Images
      # -----------------------------------
      - name: Push Backend Image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/notes-app-backend:${{ env.IMAGE_TAG }}

      - name: Push Frontend Image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/notes-app-frontend:${{ env.IMAGE_TAG }}